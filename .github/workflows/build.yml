name: Build IPA

# Builds Husk.ipa and Husk.tipa on a GitHub macOS runner with scripts/ci_build.sh.
#
# The first run compiles QEMU, ANGLE (from WebKit), virglrenderer, MoltenVK and
# the Rust pairing library from source, which takes hours. Everything it builds
# under build/ and third_party/ is cached, and every stage script skips work
# that is already done, so later runs only rebuild what changed. The cache is
# saved even when the build fails, so a long run that dies late is not lost.

on:
  workflow_dispatch:
    inputs:
      qemu_lto:
        description: "Build QEMU with link-time optimisation (rebuilds QEMU once when toggled)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Screenshots/**"
      - "showcase/**"
      - "catalog/**"
      - "altsource.json"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      HUSK_QEMU_LTO: ${{ inputs.qemu_lto && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Free disk space
        run: |
          df -h /
          # Simulator runtimes and the Xcodes we did not pick are tens of GB.
          xcrun simctl delete all || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          KEEP="$(xcode-select -p | sed 's|/Contents/Developer||')"
          for x in /Applications/Xcode_*.app; do
            [ "$x" = "$KEEP" ] || sudo rm -rf "$x"
          done
          df -h /

      - name: Install build tools
        run: |
          brew install meson ninja pkg-config xcodegen qemu
          rustup target add aarch64-apple-ios

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build
            third_party
            src/rppairing-ios/target
          key: husk-deps-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: husk-deps-

      - name: Rebuild QEMU if the LTO setting changed
        run: |
          mkdir -p build/stamps
          WANT="lto=${HUSK_QEMU_LTO:-0}"
          HAVE="$(cat build/stamps/qemu-options 2>/dev/null || echo none)"
          if [ "$WANT" != "$HAVE" ] && [ -f build/stamps/qemu ]; then
            echo "QEMU was built with $HAVE, want $WANT: rebuilding it"
            rm -f build/stamps/qemu
          fi
          echo "$WANT" > build/stamps/qemu-options

      - name: Build
        timeout-minutes: 330
        run: ./scripts/ci_build.sh build/Husk.ipa

      - name: Save build cache
        if: always() && steps.cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            build
            third_party
            src/rppairing-ios/target
          key: husk-deps-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-${{ github.sha }}
          path: |
            build/Husk.ipa
            build/Husk.tipa
          if-no-files-found: error

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            build/logs
            /tmp/husk_ipa/build.log
          if-no-files-found: ignore
